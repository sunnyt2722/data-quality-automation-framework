version: 2
models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: email
        data_tests: [not_null]
      - name: country_code
        data_tests:
          - accepted_values:
              values: ['GB', 'IE']
  - name: stg_transactions
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: currency
        data_tests:
          - accepted_values:
              values: ['GBP', 'EUR']
      - name: status
        data_tests:
          - accepted_values:
              values: ['PENDING', 'COMPLETED', 'FAILED', 'REVERSED']
